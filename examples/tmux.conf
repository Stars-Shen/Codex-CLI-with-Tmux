# Optional example: bottom tabs, clickable windows, and truecolor.
# Compatible with the tmux 3.0a setup used to verify this project.
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# New panes should not inherit an environment variable that disables colors.
set-environment -gu NO_COLOR

set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-left "[#S] "
set -g window-status-format " #I:#W "
set -g window-status-current-format " [#I:#W] "

setw -g automatic-rename off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
